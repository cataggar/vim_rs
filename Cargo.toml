[workspace]
members = [
    "vim_rs",
    "vim_macros", 
    "vim_build",
    "openapi30",
    "examples/macro_examples",
    "examples/snippets",
    "examples/utils",
    "examples/vtui",
    "examples/session_examples",
    "examples/govmoni_hosts",
    "examples/vcsim_service_content",
]
resolver = "2"

[workspace.package]
version = "0.2.4"
edition = "2021"
authors = ["Kiril Karaatanasov <karaatanasov@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/noclue/vim_rs"
homepage = "https://github.com/noclue/vim_rs"

[workspace.dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = { version = "2.11", features = ["serde"] }
thiserror = "2.0"
log = "0.4"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }

# Proc macro dependencies
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
phf = "0.11"

# Other common dependencies
base64 = "0.22"
env_logger = "0.11"
reqwest = { version = "0.12", features = ["json"] }
strum = "0.27"
strum_macros = "0.27"
convert_case = "0.8"
check_keyword = "0.4"
phf_codegen = "0.11"

# UI and CLI dependencies
anyhow = "1.0"
chrono = "0.4"
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
ratatui = { version = "0.29", features = ["crossterm"] }
simplelog = "0.12"
tui-tree-widget = "0.23"

# Build dependencies
rustc_version = "0.4"

# Internal dependencies
vim_rs = { path = "vim_rs" }
vim_macros = { path = "vim_macros" }
openapi30 = { path = "openapi30" }

[profile.release]
lto = "fat"
strip = true
opt-level = "z"
codegen-units = 1
panic = "abort"
debug = false